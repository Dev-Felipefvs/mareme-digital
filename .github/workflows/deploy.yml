# Publica o site no GitHub Pages a cada push na branch main.
# Desde 12/11/2026 o site no ar é a landing estática da pasta /web (MAREME WEB DESIGNER).
# O projeto Next.js (src/) continua no repositório, mas não é mais publicado.
# Em Settings → Pages, selecione "Source: GitHub Actions".
#
# Variáveis opcionais (Settings → Secrets and variables → Actions → Variables):
#   BASE_PATH      → deixe vazio com domínio próprio; use /nome-do-repo sem domínio
#   SITE_URL       → ex.: https://mareme.com.br
#   FORM_ENDPOINT  → URL que recebe o formulário (Formspree, Getform, API própria)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: touch web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
